<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador do Campeonato Brasileiro 2026</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0d2818;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 550px;
      height: 550px;
      background-image: url('https://upload.wikimedia.org/wikipedia/commons/9/99/CBF_logo.svg');
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      opacity: 0.08;
      z-index: -1;
      pointer-events: none;
    }

    header {
      background: linear-gradient(135deg, #009c3b 0%, #002776 100%);
      border-bottom: 4px solid #ffdf00;
      padding: 1rem;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    header h1 {
      color: #ffdf00;
      font-size: 1.8rem;
      margin-bottom: 10px;
      text-shadow: 1px 1px 3px #000;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    nav button {
      background-color: #002776;
      color: #ffdf00;
      border: 2px solid #ffdf00;
      padding: 8px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    nav button:hover, nav button.active {
      background-color: #ffdf00;
      color: #002776;
    }

    main {
      flex: 1;
      max-width: 1000px;
      width: 100%;
      margin: 20px auto;
      padding: 0 15px;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* TABELA */
    .table-container {
      background-color: rgba(10, 30, 18, 0.85);
      border-radius: 10px;
      overflow-x: auto;
      border: 1px solid rgba(255, 223, 0, 0.3);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 0.95rem;
    }

    th, td {
      padding: 10px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    th {
      background-color: #002776;
      color: #ffdf00;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 0.85rem;
    }

    tr:hover { background-color: rgba(255, 255, 255, 0.05); }
    .col-pos { font-weight: bold; width: 40px; }

    tr.g4 .col-pos { background-color: #009c3b; color: #fff; }
    tr.g5 .col-pos { background-color: #ffdf00; color: #000; }
    tr.z4 .col-pos { background-color: #d90429; color: #fff; }

    .team-cell {
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      font-weight: 600;
    }

    .team-badge {
      width: 25px;
      height: 25px;
      object-fit: contain;
    }

    .pts-col { font-weight: bold; color: #ffdf00; }

    .legend {
      display: flex;
      gap: 15px;
      margin-top: 15px;
      font-size: 0.85rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-box { width: 14px; height: 14px; border-radius: 3px; }
    .bg-green { background-color: #009c3b; }
    .bg-yellow { background-color: #ffdf00; }
    .bg-red { background-color: #d90429; }

    /* CONTROLES DE RODADA */
    .round-selector {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(10, 30, 18, 0.9);
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid #ffdf00;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .round-selector select {
      background-color: #002776;
      color: #ffdf00;
      border: 1px solid #ffdf00;
      padding: 8px 15px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
    }

    /* CARD DE JOGO */
    .games-list { display: flex; flex-direction: column; gap: 15px; }

    .game-card {
      background-color: rgba(10, 30, 18, 0.85);
      border: 1px solid rgba(255, 223, 0, 0.2);
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .game-date { font-size: 0.85rem; color: #ffdf00; font-weight: bold; }

    .game-matchup {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      width: 100%;
      max-width: 600px;
    }

    .team-info { display: flex; align-items: center; gap: 8px; flex: 1; }
    .team-info.home { justify-content: flex-end; text-align: right; }
    .team-info.away { justify-content: flex-start; text-align: left; }
    .team-info span { font-weight: 600; font-size: 0.95rem; }

    .score-input {
      width: 45px;
      height: 35px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      border: 2px solid #ffdf00;
      border-radius: 5px;
      background-color: #002776;
      color: #fff;
    }

    .vs-text { font-weight: bold; font-size: 0.9rem; color: #aaa; }

    .btn-apply {
      background-color: #009c3b;
      color: white;
      border: none;
      padding: 6px 15px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-apply:hover { background-color: #007a2e; }

    .btn-reset {
      background-color: #d90429;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.6);
      border-top: 1px solid rgba(255, 223, 0, 0.2);
    }
  </style>
</head>
<body>

  <header>
    <h1>CAMPEONATO BRASILEIRO 2026</h1>
    <nav>
      <button id="btn-home" class="active" onclick="switchTab('home')">Home (Tabela)</button>
      <button id="btn-jogos" onclick="switchTab('jogos')">Jogos</button>
    </nav>
  </header>

  <main>
    <!-- TABELA PRINCIPAL -->
    <section id="tab-home" class="tab-content active">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Pos</th>
              <th style="text-align: left;">Clube</th>
              <th>P</th>
              <th>J</th>
              <th>V</th>
              <th>E</th>
              <th>D</th>
              <th>GP</th>
              <th>GC</th>
              <th>SG</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>

      <div class="legend">
        <div class="legend-item"><div class="legend-box bg-green"></div><span>G-4 (Libertadores)</span></div>
        <div class="legend-item"><div class="legend-box bg-yellow"></div><span>5º Colocado</span></div>
        <div class="legend-item"><div class="legend-box bg-red"></div><span>Z-4 (Rebaixamento)</span></div>
      </div>
    </section>

    <!-- ABA JOGOS -->
    <section id="tab-jogos" class="tab-content">
      <div class="round-selector">
        <div>
          <label for="select-round"><b>Selecione a Rodada: </b></label>
          <select id="select-round" onchange="changeRound()"></select>
        </div>
        <button class="btn-reset" onclick="resetSimulations()">Resetar Todos os Placares</button>
      </div>

      <div class="games-list" id="games-container"></div>
    </section>
  </main>

  <footer>
    <p>Simulador do Brasileirão Série A 2026 — Selecione as rodadas, altere os placares e veja as posições mudarem na tabela!</p>
  </footer>

    function saveData() {
      localStorage.setItem('brasileirao_teams_v2', JSON.stringify(teams));
      localStorage.setItem('brasileirao_games_v2', JSON.stringify(games));
    }

    function populateRoundOptions() {
      const select = document.getElementById('select-round');
      select.innerHTML = '';
      for (let i = 27; i <= 30; i++) {
        let opt = document.createElement('option');
        opt.value = i;
        opt.innerText = `Rodada ${i}`;
        if (i === currentRound) opt.selected = true;
        select.appendChild(opt);
      }
    }

    function changeRound() {
      currentRound = parseInt(document.getElementById('select-round').value);
      renderGames();
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));

      if(tab === 'home') {
        document.getElementById('tab-home').classList.add('active');
        document.getElementById('btn-home').classList.add('active');
      } else {
        document.getElementById('tab-jogos').classList.add('active');
        document.getElementById('btn-jogos').classList.add('active');
      }
    }

    function renderTable() {
      teams.sort((a, b) => {
        let sgA = a.gp - a.gc;
        let sgB = b.gp - b.gc;
        if (b.p !== a.p) return b.p - a.p;
        if (b.v !== a.v) return b.v - a.v;
        if (sgB !== sgA) return sgB - sgA;
        return b.gp - a.gp;
      });

      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      teams.forEach((team, index) => {
        let pos = index + 1;
        let classGroup = '';
        if (pos <= 4) classGroup = 'g4';
        else if (pos === 5) classGroup = 'g5';
        else if (pos >= 17) classGroup = 'z4';

        let sg = team.gp - team.gc;

        tbody.innerHTML += `
          <tr class="${classGroup}">
            <td class="col-pos">${pos}º</td>
            <td>
              <div class="team-cell">
                <img src="${team.logo}" alt="${team.name}" class="team-badge" onError="this.src='https://via.placeholder.com/25'">
                <span>${team.name}</span>
              </div>
            </td>
            <td class="pts-col">${team.p}</td>
            <td>${team.j}</td>
            <td>${team.v}</td>
            <td>${team.e}</td>
            <td>${team.d}</td>
            <td>${team.gp}</td>
            <td>${team.gc}</td>
            <td>${sg > 0 ? '+' + sg : sg}</td>
          </tr>
        `;
      });
    }

    function renderGames() {
      const container = document.getElementById('games-container');
      container.innerHTML = '';

      let roundGames = games.filter(g => g.round === currentRound);

      roundGames.forEach(game => {
        let homeTeam = teams.find(t => t.id === game.homeId);
        let awayTeam = teams.find(t => t.id === game.awayId);

        container.innerHTML += `
          <div class="game-card">
            <div class="game-date">Rodada ${game.round} - ${game.date}</div>
            <div class="game-matchup">
              <div class="team-info home">
                <span>${homeTeam.name}</span>
                <img src="${homeTeam.logo}" alt="${homeTeam.name}" class="team-badge">
              </div>
              <input type="number" min="0" class="score-input" id="home-${game.id}" value="${game.homeScore}">
              <span class="vs-text">X</span>
              <input type="number" min="0" class="score-input" id="away-${game.id}" value="${game.awayScore}">
              <div class="team-info away">
                <img src="${awayTeam.logo}" alt="${awayTeam.name}" class="team-badge">
                <span>${awayTeam.name}</span>
              </div>
            </div>
            <button class="btn-apply" onclick="updateGameScore(${game.id})">Confirmar Placar</button>
          </div>
        `;
      });
    }

    function updateGameScore(gameId) {
      let game = games.find(g => g.id === gameId);
      let homeInput = document.getElementById(`home-${gameId}`).value;
      let awayInput = document.getElementById(`away-${gameId}`).value;

      if (homeInput === '' || awayInput === '') {
        alert('Por favor, preencha o placar dos dois times.');
        return;
      }

      let hs = parseInt(homeInput);
      let as = parseInt(awayInput);

      let homeTeam = teams.find(t => t.id === game.homeId);
      let awayTeam = teams.find(t => t.id === game.awayId);

      if (game.applied) {
        revertGameStats(homeTeam, awayTeam, game.prevHs, game.prevAs);
      }

      homeTeam.j += 1;
      awayTeam.j += 1;
      homeTeam.gp += hs;
      homeTeam.gc += as;
      awayTeam.gp += as;
      awayTeam.gc += hs;

      if (hs > as) {
        homeTeam.p += 3;
        homeTeam.v += 1;
        awayTeam.d += 1;
      } else if (as > hs) {
        awayTeam.p += 3;
        awayTeam.v += 1;
        homeTeam.d += 1;
      } else {
        homeTeam.p += 1;
        awayTeam.p += 1;
        homeTeam.e += 1;
        awayTeam.e += 1;
      }

      game.homeScore = hs;
      game.awayScore = as;
      game.prevHs = hs;
      game.prevAs = as;
      game.applied = true;

      saveData();
      renderTable();
      alert(`Placar atualizado na Tabela!`);
    }

    function revertGameStats(homeTeam, awayTeam, hs, as) {
      homeTeam.j -= 1;
      awayTeam.j -= 1;
      homeTeam.gp -= hs;
      homeTeam.gc -= as;
      awayTeam.gp -= as;
      awayTeam.gc -= hs;

      if (hs > as) {
        homeTeam.p -= 3;
        homeTeam.v -= 1;
        awayTeam.d -= 1;
      } else if (as > hs) {
        awayTeam.p -= 3;
        awayTeam.v -= 1;
        homeTeam.d -= 1;
      } else {
        homeTeam.p -= 1;
        awayTeam.p -= 1;
        homeTeam.e -= 1;
        awayTeam.e -= 1;
      }
    }

    function resetSimulations() {
      if(confirm('Deseja resetar todos os placares inseridos?')) {
        localStorage.removeItem('brasileirao_teams_v2');
        localStorage.removeItem('brasileirao_games_v2');
        teams = JSON.parse(JSON.stringify(defaultTeams));
        games = JSON.parse(JSON.stringify(defaultGames));
        renderTable();
        renderGames();
      }
    }

    window.onload = () => {
      populateRoundOptions();
      renderTable();
      renderGames();
    };
  </script>
</body>
</html>
